<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Title is set from CONFIG below: "<page> | MSU-<ABBR>" -->
<title>MSU-E-RISK</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
@font-face{font-family:'Mornamchi';src:url(fonts/Mornamchi-Light.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Mornamchi';src:url(fonts/Mornamchi-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Mornamchi';src:url(fonts/Mornamchi-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --primary:#6D4CFF;--primary-soft:rgba(109,76,255,.12);
  --bg:#F4F5FA;--paper:#fff;--text:#2E263D;--text2:#6D6777;--divider:#E6E5E8;
  --hover:rgba(46,38,61,.06);--selected:rgba(46,38,61,.10);
  --shadow:0 3px 6px rgba(46,38,61,.12);
  --nav:260px;--rail:68px;--topbar:64px;
  --font:'Mornamchi',sans-serif;--font-head:'Mornamchi',sans-serif;
  /* Risk levels (score = L × I) */
  --lv-low:#22B07D;--lv-mid:#F2B33D;--lv-high:#F27A1F;--lv-vhigh:#E5266E;
}
[data-theme="dark"]{
  --bg:#28243D;--paper:#312D4B;--text:#E7E3FC;--text2:#B6B1CC;--divider:#474360;
  --hover:rgba(231,227,252,.06);--selected:rgba(231,227,252,.10);--shadow:0 3px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:start}
a{color:inherit;text-decoration:none}
select,input{font:inherit;color:var(--text);background:var(--paper);border:1px solid var(--divider);border-radius:8px;padding:7px 10px}

/* ── Sidebar ── */
.nav{position:fixed;inset-block:0;inset-inline-start:0;inline-size:var(--nav);background:var(--paper);
  border-inline-end:1px solid var(--divider);box-shadow:4px 0 16px -10px rgba(15,23,42,.1);
  display:flex;flex-direction:column;z-index:20;transition:inline-size .25s,transform .25s}
.brand{display:flex;align-items:center;gap:8px;padding:15px 12px}
.brand-logo{display:flex;align-items:center;min-inline-size:0;gap:8px}
.brand-logo img{block-size:16px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-inline-size:0;overflow:hidden}
.brand-over{font-size:.475rem;font-weight:600;letter-spacing:0;text-transform:uppercase;color:var(--text2);white-space:nowrap}
.brand-name{font-family:var(--font-head);font-size:1.0625rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:.625rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{color:var(--text2);font-size:1.25rem;flex-shrink:0;margin-inline-start:auto}

.menu{flex:1;overflow-y:auto;padding:4px 16px 8px 0;margin:0;list-style:none}
.menu ul{list-style:none;margin:0;padding:0;overflow:hidden}
.item,.group-btn{display:flex;align-items:center;gap:10px;inline-size:100%;margin-block-start:6px;
  padding:8px 14px 8px 22px;border-start-end-radius:50px;border-end-end-radius:50px;white-space:nowrap}
.item:hover,.group-btn:hover{background:var(--hover)}
.group-btn i:first-child,.item>i{font-size:1.375rem}
.group-btn .chev{margin-inline-start:auto;transition:transform .2s}
.group.open>.group-btn{background:var(--selected)}
.group.open>.group-btn .chev{transform:rotate(90deg)}
.group:not(.open)>ul{display:none}
.group ul .item{padding-inline-start:30px}
.group ul .item>i{font-size:1.1rem;color:var(--text2)}
.item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.item.active>i{color:var(--primary)}
.label{flex:1;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:.7rem;padding:1px 8px;border-radius:12px;border:1px solid #56CA00;color:#56CA00}
.count{font-size:.7rem;min-inline-size:20px;padding:1px 6px;border-radius:10px;background:var(--lv-vhigh);color:#fff;text-align:center;font-weight:700}

.nav-foot{padding:12px}
.round-card{border-radius:12px;padding:14px;color:#fff;background:linear-gradient(135deg,#6D4CFF,#4B2FD1);font-size:.75rem}
.round-card b{display:block;font-size:.95rem;margin-block:2px 8px}
.round-card .bar{block-size:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-block-end:6px}
.round-card .bar span{display:block;block-size:100%;background:#fff;border-radius:3px}

/* Icon-only rail (desktop, pinned off) — expands on hover */
body.rail .nav:not(:hover){inline-size:var(--rail)}
body.rail .nav:not(:hover) :is(.brand-text,.pin,.label,.chip,.count,.chev,.nav-foot){display:none}
body.rail .nav:not(:hover) .group>ul{display:none}
body.rail .nav:not(:hover) .brand{padding-inline:8px}
body.rail .nav:not(:hover) .menu{padding-inline-end:8px}
body.rail .nav:not(:hover) :is(.item,.group-btn){padding-inline-start:22px}

/* ── Main ── */
.main{margin-inline-start:var(--nav);min-block-size:100vh;display:flex;flex-direction:column;transition:margin .25s}
body.rail .main{margin-inline-start:var(--rail)}
.topbar{position:sticky;top:0;z-index:10;block-size:var(--topbar);display:flex;align-items:center;gap:8px;
  padding-inline:24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px)}
.icon-btn{inline-size:38px;block-size:38px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;position:relative}
.icon-btn:hover{background:var(--hover)}
.icon-btn .count{position:absolute;inset-block-start:2px;inset-inline-end:0}
.burger{display:none}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--divider);border-radius:10px;padding-inline:12px;inline-size:min(420px,100%)}
.search input{border:0;padding:8px 0;flex:1;min-inline-size:0;outline:none;background:none}
.avatar{inline-size:38px;block-size:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-weight:700;position:relative}
.avatar::after{content:'';position:absolute;inset-block-end:0;inset-inline-end:0;inline-size:9px;block-size:9px;border-radius:50%;
  background:#56CA00;box-shadow:0 0 0 2px var(--paper)}
.profile{position:relative}
.dropdown{position:absolute;inset-inline-end:0;top:calc(100% + 10px);min-inline-size:240px;background:var(--paper);
  border-radius:8px;box-shadow:0 6px 16px rgba(46,38,61,.22);padding:8px 0;display:none}
.dropdown.open{display:block}
.dd-head{display:flex;gap:10px;align-items:center;padding:8px 16px}
.dd-head small{display:block;color:var(--text2)}
.dd-sep{block-size:1px;background:var(--divider);margin:6px 0}
.dd-label{font-size:.75rem;color:var(--primary);padding:4px 16px}
.dd-item{display:flex;align-items:center;gap:12px;inline-size:100%;padding:8px 16px;text-align:start}
.dd-item:hover{background:var(--hover)}
.dd-item.selected{background:var(--primary-soft)}
.dd-item .ri-check-line{margin-inline-start:auto;color:var(--primary)}
.logout{margin:8px 16px 4px;inline-size:calc(100% - 32px);padding:6px;border-radius:6px;background:#FF4C51;color:#fff;font-weight:600}

.content{flex:1;padding:24px;max-inline-size:1440px;inline-size:100%;margin-inline:auto}
.card{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.card h1{font-family:var(--font-head);font-size:1.25rem;margin:0 0 4px}
.muted{color:var(--text2)}
footer{padding:16px 24px;text-align:center;color:var(--text2);font-size:.85rem}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}

/* ── Dashboard ── */
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-block-end:20px}
.page-head h1{font-family:var(--font-head);font-size:1.5rem;margin:2px 0}
.page-head p{margin:0;font-size:.85rem}
.crumb{font-size:.8rem;color:var(--text2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-primary{background:var(--primary);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn-primary:hover{filter:brightness(1.08)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-block-end:20px}
.kpi{border-radius:14px;padding:16px;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi small{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.kpi .k-title{font-weight:600;font-size:.9rem}
.kpi .k-ico{inline-size:36px;block-size:36px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.kpi .k-val{font-family:var(--font-head);font-size:2rem;font-weight:800;line-height:1.1;margin-block-start:6px}
.kpi .k-val span{font-size:1rem;font-weight:600;opacity:.85}
.kpi .k-sub{font-size:.8rem;opacity:.92}
.kpi .bar{block-size:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-block:4px}
.kpi .bar span{display:block;block-size:100%;background:#fff}

.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-block-end:16px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-block-end:14px}
.panel-head h2{font-size:1.05rem;margin:0;font-family:var(--font-head)}
.panel-head p{margin:2px 0 0;font-size:.8rem;color:var(--text2)}
.link{color:var(--primary);font-size:.85rem;font-weight:600}

.seg{display:inline-flex;border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;font-size:.8rem}
.seg button.on{background:var(--primary);color:#fff}

.legend{display:flex;flex-wrap:wrap;gap:6px}
.lv{font-size:.72rem;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600;white-space:nowrap}

/* Heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.heat .ax{display:grid;place-items:center;font-size:.8rem;color:var(--text2)}
.cell{border-radius:10px;color:#fff;text-align:center;padding:10px 4px;min-block-size:58px;display:flex;flex-direction:column;justify-content:center;transition:transform .12s,box-shadow .12s}
.cell:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cell b{font-size:1.3rem;line-height:1}
.cell small{font-size:.65rem;opacity:.9}
.cell.zero{opacity:.35}
.ax-title{font-size:.75rem;color:var(--text2);text-align:center;margin-block-start:8px}

/* KRI */
.kri{display:block;inline-size:100%;border-radius:10px;padding:10px 12px;margin-block-end:8px;border-inline-start:4px solid;background:var(--hover)}
.kri:hover{background:var(--selected)}
.kri .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.88rem}
.kri small{color:var(--text2);font-size:.75rem}
.tag{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;align-self:flex-start;white-space:nowrap}

/* Status matrix */
.matrix{inline-size:100%;border-collapse:collapse;font-size:.83rem}
.matrix th{font-weight:600;color:var(--text2);text-align:start;padding:6px 8px;font-size:.78rem}
.matrix td{padding:5px 8px;border-block-start:1px solid var(--divider)}
.matrix td:first-child{white-space:nowrap;max-inline-size:220px;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.st-legend{display:flex;flex-wrap:wrap;gap:6px;margin-block-end:10px}
.st-legend button{display:inline-flex;gap:4px;align-items:center}
.scroll{overflow-x:auto}

/* Donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.donut path,.donut circle.seg{cursor:pointer;transition:opacity .15s}
.donut circle.seg:hover{opacity:.8}
.dlegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;inline-size:100%;font-size:.8rem}
.dlegend button{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}
.dlegend button:hover{background:var(--hover)}
.dot{inline-size:10px;block-size:10px;border-radius:50%;flex-shrink:0}

/* Tables */
.tbl{inline-size:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:start;font-size:.75rem;color:var(--text2);font-weight:600;padding:8px;border-block-end:1px solid var(--divider);white-space:nowrap}
.tbl td{padding:9px 8px;border-block-end:1px solid var(--divider)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--text2);white-space:nowrap}
.score{display:inline-grid;place-items:center;min-inline-size:28px;padding:2px 6px;border-radius:8px;color:#fff;font-weight:700;font-size:.78rem}
.trend-up{color:var(--lv-vhigh)}.trend-down{color:var(--lv-low)}.trend-eq{color:var(--text2)}

/* Tasks */
.task{display:block;inline-size:100%;border-radius:10px;padding:10px 12px;margin-block-end:8px;border:1px solid var(--divider)}
.task:hover{background:var(--hover)}
.task .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.88rem}
.task small{color:var(--text2);font-size:.75rem}

/* Modal + toast */
dialog{border:0;border-radius:14px;padding:0;inline-size:min(860px,calc(100vw - 32px));max-block-size:calc(100vh - 48px);background:var(--paper);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,16,40,.45)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-block-end:1px solid var(--divider);position:sticky;top:0;background:var(--paper)}
.m-head h3{margin:0;font-size:1.05rem;font-family:var(--font-head)}
.m-body{padding:16px 20px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block-start:12px;font-size:.85rem;color:var(--text2)}
.pager button{border:1px solid var(--divider);border-radius:8px;padding:4px 12px}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:32px 12px;color:var(--text2)}
.empty i{font-size:2.5rem;display:block;margin-block-end:6px;opacity:.6}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:.9rem;margin-block-end:16px}
.kv dt{color:var(--text2)}.kv dd{margin:0}
.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:.75rem}
.rounds div{border:1px solid var(--divider);border-radius:10px;padding:8px 4px}
.toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(-50%);background:#2E263D;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:50;display:none;gap:8px;align-items:center}
.toast.show{display:flex}

/* ── Mobile: sidebar becomes a drawer ── */
@media (max-width:1199px){
  .nav{transform:translateX(-100%);inline-size:var(--nav)!important}
  body.drawer .nav{transform:none}
  body.drawer .backdrop{display:block}
  .main,body.rail .main{margin-inline-start:0}
  .pin{display:none}
  .burger{display:grid}
  body.rail .nav :is(.brand-text,.label,.chip,.count,.chev,.nav-foot){display:revert}
  .topbar,.content{padding-inline:16px}
  .row{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .search kbd,.search{display:none}
  .cell{min-block-size:46px;padding:6px 2px}.cell b{font-size:1.05rem}.cell small{display:none}
  /* Tables collapse to stacked cards */
  .tbl thead{display:none}
  .tbl tr{display:block;border:1px solid var(--divider);border-radius:10px;padding:8px;margin-block-end:8px}
  .tbl td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 4px}
  .tbl td::before{content:attr(data-h);color:var(--text2);font-size:.75rem}
  .kv{grid-template-columns:1fr}
  .rounds{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<aside class="nav" id="nav">
  <div class="brand">
    <a href="#" class="brand-logo">
      <img src="msu-logo.png" alt="MSU">
      <div class="brand-text">
        <span class="brand-over" data-cfg="overline"></span>
        <span class="brand-name" data-cfg="name"></span>
        <span class="brand-sub" data-cfg="subtitle"></span>
      </div>
    </a>
    <button class="pin" id="pin" title="ย่อ/ขยายแถบเมนู" aria-label="ย่อ/ขยายแถบเมนู"><i class="ri-radio-button-line"></i></button>
  </div>
  <ul class="menu" id="menu"></ul>
  <div class="nav-foot" id="nav-foot"></div>
</aside>
<div class="backdrop" id="backdrop"></div>

<div class="main">
  <header class="topbar">
    <button class="icon-btn burger" id="burger" aria-label="เปิดเมนู"><i class="ri-menu-line"></i></button>
    <label class="search"><i class="ri-search-line muted"></i><input id="search" placeholder="ค้นหาความเสี่ยง / รหัส / หน่วยงาน… (Enter)"></label>
    <div class="spacer"></div>
    <button class="icon-btn" id="bell" aria-label="งานที่ต้องดำเนินการ"><i class="ri-notification-3-line"></i><span class="count" id="bell-count"></span></button>
    <button class="icon-btn" id="mode" aria-label="สลับโหมดสว่าง/มืด"><i class="ri-sun-line"></i></button>
    <div class="profile">
      <button class="avatar" id="avatar" aria-haspopup="menu" aria-expanded="false">ผ</button>
      <div class="dropdown" id="dropdown" role="menu">
        <div class="dd-head"><span class="avatar">ผ</span><div><b>ชื่อ นามสกุล</b><small>หน่วยงาน</small></div></div>
        <div class="dd-sep"></div>
        <div class="dd-label">มุมมองสิทธิ์</div>
        <div id="roles"></div>
        <div class="dd-sep"></div>
        <button class="dd-item" role="menuitem"><i class="ri-user-3-line"></i>โปรไฟล์</button>
        <button class="dd-item" role="menuitem"><i class="ri-settings-4-line"></i>ตั้งค่า</button>
        <button class="logout">ออกจากระบบ <i class="ri-logout-box-r-line"></i></button>
      </div>
    </div>
  </header>

  <main class="content" id="content"></main>
  <footer>© <span id="year"></span> มหาวิทยาลัยมหาสารคาม · ข้อมูลในหน้านี้เป็นข้อมูลสมมติสำหรับ mockup</footer>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="m-head"><h3 id="modal-title"></h3><button class="icon-btn" id="modal-close" aria-label="ปิด"><i class="ri-close-line"></i></button></div>
  <div class="m-body" id="modal-body"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ════ CONFIG — rename the system here first (same rule as themeConfig.ts) ════ */
const CONFIG = {
  overline: 'Mahasarakham University',
  name: 'MSU-E-RISK',
  subtitle: 'ระบบบริหารความเสี่ยง มมส'
}

// Sidebar menu — single source of truth. minRole hides a group below that tier (visibility only).
// Groups follow the e-Risk workflow (Design/Workflow-e-Risk.png).
const MENU = [
  { label: 'HOME', icon: 'ri-home-line', children: [
    { label: 'Dashboard', href: '#dashboard', icon: 'ri-dashboard-line', badge: 'tasks' }
  ]},
  { label: 'ความเสี่ยง', icon: 'ri-shield-flash-line', children: [
    { label: 'SO', href: '#so', icon: 'ri-star-line' },
    { label: 'เป้าประสงค์', href: '#goals', icon: 'ri-focus-3-line' },
    { label: 'ERM1', href: '#erm1', icon: 'ri-chat-search-line' },
    { label: 'ERM2 - 3', href: '#erm2-3', icon: 'ri-record-circle-line' },
    { label: 'ERM4', href: '#erm4', icon: 'ri-menu-2-line' }
  ]},
  { label: 'ควบคุมภายใน', icon: 'ri-shield-check-line', children: [
    { label: 'ตั้งค่าข้อคำถาม', href: '#questions', icon: 'ri-equalizer-line' },
    { label: 'ภาคผนวก ก.', href: '#appendix-a', icon: 'ri-file-text-line' },
    { label: 'ปค. 4', href: '#pk4', icon: 'ri-file-list-2-line' },

function prng(seed) { // mulberry32
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
}
const cache = {}
function yearData(year) {
  if (cache[year]) return cache[year]
  const r = prng(year)
  const risks = [], kris = []
  let seq = 1
  UNITS.forEach((unit, ui) => {
    const pool = [...RISK_TEMPLATES].sort(() => r() - .5).slice(0, 5 + Math.floor(r() * 5))
    pool.forEach(([cat, name]) => {
      const L = 2 + Math.floor(r() * 4), I = 2 + Math.floor(r() * 4)
      risks.push({
        id: `RSK-${String(year).slice(2)}-${String(seq++).padStart(3, '0')}`, name, cat, unit, ui,
        owner: OWNERS[Math.floor(r() * OWNERS.length)], L, I,
        dL: Math.floor(r() * 3), dI: Math.floor(r() * 2), worsen: r() < .1, speed: .55 + r() * .7,
        measure: ['ทบทวนและปรับปรุงคู่มือปฏิบัติงาน', 'จัดอบรมบุคลากรที่เกี่ยวข้อง', 'ติดตั้งระบบเฝ้าระวังและแจ้งเตือน', 'จัดทำแผนสำรองและซ้อมแผน', 'ปรับกระบวนการและกำหนดผู้รับผิดชอบชัดเจน'][Math.floor(r() * 5)]
      })
    })
    ;[...KRI_TEMPLATES].sort(() => r() - .5).slice(0, 1 + Math.floor(r() * 2))
      .forEach(t => kris.push({ ...t, unit_: unit, ui, base: r(), drift: r() * .3 - .15 }))
  })
  return (cache[year] = { risks, kris })
}
const residual = (k, round) => k.worsen
  ? { L: Math.min(5, k.L + (round >= 2 ? 1 : 0)), I: k.I }
  : { L: Math.max(1, k.L - Math.round(k.dL * (round + 1) / 4)), I: Math.max(1, k.I - Math.round(k.dI * (round + 1) / 4)) }
const scoreAt = (k, round) => { const x = residual(k, round); return x.L * x.I }
const progress = (k, round) => Math.min(100, Math.round((round + 1) / 4 * 100 * k.speed))
const delayed = (k, round) => progress(k, round) < (round + 1) / 4 * 100 - 10
const trend = (k, round) => { const now = scoreAt(k, round), prev = round ? scoreAt(k, round - 1) : k.L * k.I; return Math.sign(now - prev) }
function level(s) {
  if (s <= 4) return { name: 'ต่ำ', c: 'var(--lv-low)' }
  if (s <= 9) return { name: 'ปานกลาง', c: 'var(--lv-mid)' }
  if (s <= 15) return { name: 'สูง', c: 'var(--lv-high)' }
  return { name: 'สูงมาก', c: 'var(--lv-vhigh)' }
}
function kriValue(k, year, round) {
  const v = k.dir === 'min' ? k.thr * (.82 + k.base * .3 + k.drift * round / 3) : k.thr * (.4 + k.base * 1.0 + k.drift * round)
  return k.unit === '%' ? Math.round(v * 10) / 10 : Math.max(0, Math.round(v))
}
function kriStatus(k, v) {
  if (k.dir === 'min') return v < k.thr ? 'RED' : v < k.thr * 1.06 ? 'AMBER' : 'GREEN'
  return v > k.thr ? 'RED' : v >= k.thr * .8 && v > 0 ? 'AMBER' : 'GREEN'
}
const KRI_C = { RED: 'var(--lv-vhigh)', AMBER: 'var(--lv-mid)', GREEN: 'var(--lv-low)' }
function unitStatus(year, round, ui, sel) {
  if (round > sel) return 'closed'
  if (round < sel) return 'ok'
  const x = prng(year * 1000 + round * 97 + ui * 13)()
  return x < .3 ? 'ok' : x < .5 ? 'plan' : x < .65 ? 'head' : x < .75 ? 'back' : x < .9 ? 'draft' : 'none'
}

function view() {
  const { year, round, unit } = state.f
  const d = yearData(year)
  const inUnit = x => unit === 'all' || x.ui === +unit
  const risks = d.risks.filter(inUnit)
  const kris = d.kris.filter(inUnit).map(k => { const v = kriValue(k, year, round); return { ...k, v, st: kriStatus(k, v) } })
  const units = UNITS.map((name, ui) => ({ name, ui })).filter(inUnit)
    .map(u => ({ ...u, st: unitStatus(year, round, u.ui, round), all: ROUNDS.map((_, ri) => unitStatus(year, ri, u.ui, round)) }))
  return { year, round, unit, risks, kris, units }
}
function tasks(v) {
  const by = s => v.units.filter(u => u.st === s)

  const late = v.risks.filter(k => delayed(k, v.round))

    { key: 'due', title: `ครบกำหนดส่งรอบ${ROUNDS[v.round].label}`, sub: `ภายใน ${ROUNDS[v.round].due(v.year)} · ยังไม่ส่ง ${v.units.filter(u => ['none', 'draft', 'back'].includes(u.st)).length} หน่วยงาน`, n: 0, tag: ['กำหนดการ', 'var(--text2)', 'var(--selected)'], open: () => openUnits('หน่วยงานที่ยังไม่ส่ง', v.units.filter(u => ['none', 'draft', 'back'].includes(u.st))) }

function renderDashboard() {
  const v = view(), f = state.f
  const res = v.risks.map(k => ({ k, s: scoreAt(k, v.round) }))
  const cnt = name => res.filter(x => level(x.s).name === name).length
  const sent = v.units.filter(u => !['none', 'draft'].includes(u.st))
  const pctSent = Math.round(sent.length / Math.max(1, v.units.length) * 100)
  const red = v.kris.filter(k => k.st === 'RED'), amber = v.kris.filter(k => k.st === 'AMBER')
  const late = v.risks.filter(k => delayed(k, v.round))
  const avgProg = Math.round(v.risks.reduce((a, k) => a + progress(k, v.round), 0) / Math.max(1, v.risks.length))
  const T = tasks(v), pending = T.slice(0, 3).reduce((a, t) => a + t.n, 0)
  const unitLabel = f.unit === 'all' ? `ทั้งมหาวิทยาลัย (${UNITS.length} หน่วยงาน)` : UNITS[f.unit]

  drills.kpi1 = () => openRisks('ความเสี่ยงที่ขึ้นทะเบียน (ERM1)', v.risks)
  drills.kpi2 = () => openUnits(`สถานะการส่ง รอบ${ROUNDS[v.round].label}`, v.units)
  drills.kpi3 = () => openKris('KRI ที่เกินเกณฑ์หรือใกล้เกณฑ์', [...red, ...amber])
  drills.kpi4 = () => openRisks('มาตรการล่าช้ากว่าแผน (ปค.5)', late)
  drills.kpi5 = () => openUnits('รายการรอเห็นชอบ / รอรับรอง / ตีกลับ', v.units.filter(u => ['head', 'plan', 'back'].includes(u.st)))
  drills.allKri = () => openKris('KRI ทั้งหมด', v.kris)
  drills.allRisk = () => openRisks('ทะเบียนความเสี่ยงทั้งหมด', [...v.risks].sort((a, b) => scoreAt(b, v.round) - scoreAt(a, v.round)))
  T.forEach(t => { drills['task-' + t.key] = t.open })

  const kpi = (key, grad, over, title, icon, val, sub, bar) => `
    <button class="kpi" style="background:linear-gradient(135deg,${grad})" data-drill="${key}">
      <div class="k-top"><div><small>${over}</small><div class="k-title">${title}</div></div><span class="k-ico"><i class="${icon}"></i></span></div>
      <div class="k-val">${val}</div>${bar != null ? `<div class="bar"><span style="inline-size:${bar}%"></span></div>` : ''}<div class="k-sub">${sub}</div>
    </button>`

  // Heatmap: rows = likelihood 5→1, cols = impact 1→5
  const heatPos = k => f.heat === 'inh' ? { L: k.L, I: k.I } : residual(k, v.round)
  let heat = ''
  for (let L = 5; L >= 1; L--) {
    heat += `<div class="ax">${L}</div>`
    for (let I = 1; I <= 5; I++) {
      const list = v.risks.filter(k => { const p = heatPos(k); return p.L === L && p.I === I })
      const key = `h${L}${I}`
      drills[key] = () => openRisks(`ความเสี่ยงในช่อง โอกาส ${L} × ผลกระทบ ${I} (${f.heat === 'inh' ? 'Inherent' : 'Residual'})`, list)
      heat += `<button class="cell${list.length ? '' : ' zero'}" style="background:${level(L * I).c}" data-drill="${key}" aria-label="โอกาส ${L} ผลกระทบ ${I}: ${list.length} รายการ"><b>${list.length}</b><small>คะแนน ${L * I}</small></button>`
    }
  }
  heat += '<div></div>' + [1, 2, 3, 4, 5].map(i => `<div class="ax">${i}</div>`).join('')

  const kriList = [...red, ...amber].slice(0, 5)
  kriList.forEach((k, i) => { drills['kri' + i] = () => openKri(k) })

  // Donut by category
  const byCat = CATS.map((c, ci) => ({ ...c, ci, list: v.risks.filter(k => k.cat === ci) }))
  const C = 2 * Math.PI * 60, total = Math.max(1, v.risks.length)
  let off = 0
  const segs = byCat.map(c => {
    drills['cat' + c.ci] = () => openRisks(`ความเสี่ยงด้าน${c.name}`, c.list)
    const len = c.list.length / total * C
    const s = `<circle class="seg" data-drill="cat${c.ci}" cx="80" cy="80" r="60" fill="none" stroke="${c.color}" stroke-width="26"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${c.name}: ${c.list.length}</title></circle>`
    off += len
    return s
  }).join('')

  // Status legend counts for the selected round
  const stCounts = Object.keys(STATUS).filter(s => s !== 'closed').map(s => ({ s, list: v.units.filter(u => u.st === s) })).filter(x => x.list.length)

  const top = [...v.risks].sort((a, b) => scoreAt(b, v.round) - scoreAt(a, v.round) || b.L * b.I - a.L * a.I).slice(0, 5)

      <select id="f-round" aria-label="รอบรายงาน">${ROUNDS.map((r, i) => `<option value="${i}"${i === f.round ? ' selected' : ''}>รอบ${r.label}</option>`).join('')}</select>
      <select id="f-unit" aria-label="หน่วยงาน"><option value="all">ทุกหน่วยงาน</option>${UNITS.map((u, i) => `<option value="${i}"${String(i) === String(f.unit) ? ' selected' : ''}>${u}</option>`).join('')}</select>

    ${kpi('kpi2', '#F2A93B,#DB8414', 'ERM2 · การส่งข้อมูล', 'หน่วยงานส่งข้อมูลแล้ว', 'ri-send-plane-line', `${pctSent}<span>%</span>`, `ส่งแล้ว ${sent.length} / ${v.units.length} หน่วยงาน`, pctSent)}
    ${kpi('kpi3', '#1E6FD9,#1553A8', 'ERM4 · KRI', 'ตัวชี้วัดเตือนภัยล่วงหน้า', 'ri-pulse-line', `${red.length + amber.length}<span> / ${v.kris.length}</span>`, `เกินเกณฑ์ (RED) ${red.length} · ใกล้เกณฑ์ (AMBER) ${amber.length}`)}
    ${kpi('kpi4', '#8A5A33,#5C3B1F', 'ปค.5 · มาตรการ', 'ความคืบหน้ามาตรการเฉลี่ย', 'ri-loop-right-line', `${avgProg}<span>%</span>`, `ล่าช้ากว่าแผน ${late.length} มาตรการ`, avgProg)}
    ${kpi('kpi5', '#E5266E,#B81A55', 'Workflow', 'รอพิจารณา / ตีกลับ', 'ri-inbox-unarchive-line', pending, `รอเห็นชอบ ${T[0].n} · รอรับรอง ${T[1].n} · ตีกลับ ${T[2].n}`)}

  <div class="row">

        <div class="seg" role="group" aria-label="ประเภทคะแนน">

function riskTable(list, round) {
  if (!list.length) return '<div class="empty"><i class="ri-inbox-line"></i>ไม่พบรายการความเสี่ยงตามเงื่อนไขนี้</div>'
  return `<div class="scroll"><table class="tbl"><thead><tr><th>รหัส</th><th>ความเสี่ยง</th><th>หน่วยงาน</th><th>Inherent</th><th>Residual</th><th>แนวโน้ม</th></tr></thead>
    <tbody>${list.map(k => `<tr data-risk="${k.id}">
      <td data-h="รหัส" class="mono">${k.id}</td><td data-h="ความเสี่ยง">${esc(k.name)}</td><td data-h="หน่วยงาน">${esc(k.unit)}</td>
      <td data-h="Inherent">${scoreChip(k.L * k.I)}</td><td data-h="Residual">${scoreChip(scoreAt(k, round))}</td><td data-h="แนวโน้ม">${trendIcon(trend(k, round))}</td></tr>`).join('')}</tbody></table></div>`
}

/* ════ DRILL-DOWN MODALS ════ */
const modal = $('#modal')
function openModal(title, html) { $('#modal-title').textContent = title; $('#modal-body').innerHTML = html; if (!modal.open) modal.showModal() }
$('#modal-close').addEventListener('click', () => modal.close())
modal.addEventListener('click', e => { if (e.target === modal) modal.close() })

// Paginated list inside the modal; render(rows) returns the table HTML for one page
function openPaged(title, rows, render, per = 10) {
  let page = 0
  const draw = () => {
    const pages = Math.max(1, Math.ceil(rows.length / per))
    openModal(title, (rows.length ? render(rows.slice(page * per, page * per + per)) : render([])) +
      (rows.length > per ? `<div class="pager"><span>แสดง ${page * per + 1}–${Math.min(rows.length, page * per + per)} จาก ${rows.length}</span>
        <span><button data-pg="-1"${page ? '' : ' disabled'}>ก่อนหน้า</button> หน้า ${page + 1}/${pages} <button data-pg="1"${page < pages - 1 ? '' : ' disabled'}>ถัดไป</button></span></div>` : `<div class="pager"><span>ทั้งหมด ${rows.length} รายการ</span></div>`))
    $('#modal-body').querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { page += +b.dataset.pg; draw() })
  }
  draw()
}
const openRisks = (title, list) => openPaged(title, list, rows => riskTable(rows, state.f.round))
function openUnits(title, list) {
  openPaged(title, list, rows => rows.length ? `<table class="tbl"><thead><tr><th>หน่วยงาน</th><th>สถานะรอบ${ROUNDS[state.f.round].label}</th><th>จำนวนความเสี่ยง</th></tr></thead><tbody>
    ${rows.map(u => `<tr data-unit="${u.ui}"><td data-h="หน่วยงาน">${esc(u.name)}</td><td data-h="สถานะ">${pill(u.st)}</td><td data-h="ความเสี่ยง">${yearData(state.f.year).risks.filter(k => k.ui === u.ui).length}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty"><i class="ri-checkbox-circle-line"></i>ไม่มีหน่วยงานในสถานะนี้</div>')
}
function openKris(title, list) {
  openPaged(title, list, rows => rows.length ? `<table class="tbl"><thead><tr><th>ตัวชี้วัด</th><th>หน่วยงาน</th><th>ค่าจริง</th><th>เกณฑ์</th><th>สถานะ</th></tr></thead><tbody>
    ${rows.map(k => `<tr><td data-h="ตัวชี้วัด">${esc(k.name)}</td><td data-h="หน่วยงาน">${esc(k.unit_)}</td><td data-h="ค่าจริง">${k.v} ${k.unit}</td>
      <td data-h="เกณฑ์">${k.dir === 'min' ? '≥' : '≤'} ${k.thr} ${k.unit}</td><td data-h="สถานะ"><span class="tag" style="background:${KRI_C[k.st]}">${k.st}</span></td></tr>`).join('')}</tbody></table>`
    : '<div class="empty"><i class="ri-checkbox-circle-line"></i>ไม่มี KRI ตามเงื่อนไขนี้</div>')
}
function openKri(k) {
  openModal(k.name, `<dl class="kv"><dt>หน่วยงาน</dt><dd>${esc(k.unit_)}</dd><dt>ค่าจริงรอบนี้</dt><dd><b>${k.v} ${k.unit}</b></dd>
    <dt>เกณฑ์</dt><dd>${k.dir === 'min' ? 'ไม่ต่ำกว่า' : 'ไม่เกิน'} ${k.thr} ${k.unit}</dd><dt>สถานะ</dt><dd><span class="tag" style="background:${KRI_C[k.st]}">${k.st}</span></dd></dl>
    <div class="rounds">${ROUNDS.map((r, i) => { const x = kriValue(k, state.f.year, i), s = kriStatus(k, x); return `<div><small class="muted">${r.label}</small><br><b style="color:${KRI_C[s]}">${x} ${k.unit}</b></div>` }).join('')}</div>`)
}
function openRisk(k) {
  const round = state.f.round, p = progress(k, round)
  openModal(`${k.id} · ${k.name}`, `<dl class="kv">
    <dt>หน่วยงาน</dt><dd>${esc(k.unit)}</dd><dt>ประเภท</dt><dd>${CATS[k.cat].name}</dd><dt>Risk Owner</dt><dd>${esc(k.owner)}</dd>
    <dt>มาตรการ (ERM3)</dt><dd>${esc(k.measure)}</dd>
    <dt>ความคืบหน้า</dt><dd><div style="display:flex;gap:8px;align-items:center"><div style="flex:1;block-size:8px;border-radius:4px;background:var(--selected);overflow:hidden"><span style="display:block;block-size:100%;inline-size:${p}%;background:${delayed(k, round) ? 'var(--lv-high)' : 'var(--lv-low)'}"></span></div><b>${p}%</b>${delayed(k, round) ? '<span class="tag" style="background:var(--lv-high)">ล่าช้า</span>' : ''}</div></dd></dl>
    <div class="rounds"><div><small class="muted">Inherent</small><br>${scoreChip(k.L * k.I)}<br><small>L${k.L} × I${k.I}</small></div>
    ${ROUNDS.map((r, i) => { const x = residual(k, i); return `<div${i === round ? ' style="border-color:var(--primary)"' : ''}><small class="muted">${r.label}</small><br>${scoreChip(x.L * x.I)}<br><small>L${x.L} × I${x.I}</small></div>` }).join('')}</div>`)
}

$('#content').addEventListener('click', e => {
  const d = e.target.closest('[data-drill]'); if (d && drills[d.dataset.drill]) return drills[d.dataset.drill]()
  const h = e.target.closest('[data-heat]'); if (h) { state.f.heat = h.dataset.heat; saveFilter() }
  const r = e.target.closest('[data-risk]'); if (r) openRisk(yearData(state.f.year).risks.find(k => k.id === r.dataset.risk))

$('#modal-body').addEventListener('click', e => {

  const u = e.target.closest('[data-unit]'); if (u) openRisks(`ความเสี่ยงของ${UNITS[u.dataset.unit]}`, yearData(state.f.year).risks.filter(k => k.ui === +u.dataset.unit))

  const id = e.target.id
  if (id === 'f-year') state.f.year = +e.target.value

function toast(msg, icon = 'ri-checkbox-circle-line') {
  const t = $('#toast'); t.innerHTML = `<i class="${icon}"></i>${esc(msg)}`; t.classList.add('show')
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800)
}
function exportCsv() {
  const v = view()
  const rows = [['รหัส', 'ความเสี่ยง', 'ประเภท', 'หน่วยงาน', 'Risk Owner', 'Inherent', 'Residual', 'ระดับ', 'ความคืบหน้ามาตรการ (%)']]
    .concat(v.risks.map(k => [k.id, k.name, CATS[k.cat].name, k.unit, k.owner, k.L * k.I, scoreAt(k, v.round), level(scoreAt(k, v.round)).name, progress(k, v.round)]))
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }))
  a.download = `e-risk-${v.year}-round${v.round}.csv`; a.click(); URL.revokeObjectURL(a.href)
  toast(`ส่งออก ${v.risks.length} รายการแล้ว (เปิดด้วย Excel ได้)`)
}
